{% extends "core/base.html" %}

{% block title %}Login | ChessLab{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome Back</h2>
    <form method="post" action="{% url 'template_login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Sign In</button>
    </form>
    <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
        Don't have an account? <a href="{% url 'register' %}" style="color: var(--accent-green);">Register here</a>
    </p>
</div>
{% endblock %}
